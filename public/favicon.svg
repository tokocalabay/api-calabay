<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="calabay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="calabay-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#calabay-bg)" stroke="url(#calabay-grad)" stroke-width="4"/>

  <!-- Glowing Geometric C & Security Token Node -->
  <g filter="url(#glow)">
    <!-- Stylized Modern C Arc -->
    <path d="M84 38 C56 36 40 48 40 64 C40 80 56 92 84 90" 
          fill="none" 
          stroke="url(#calabay-grad)" 
          stroke-width="12" 
          stroke-linecap="round"/>
    
    <!-- OTP Verification Spark / Center Node -->
    <circle cx="70" cy="64" r="8" fill="#10b981" />
    <circle cx="86" cy="38" r="5" fill="#6366f1" />
    <circle cx="86" cy="90" r="5" fill="#38bdf8" />
  </g>
</svg>
