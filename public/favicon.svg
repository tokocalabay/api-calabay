<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="calabay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="calabay-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#calabay-bg)" stroke="url(#calabay-grad)" stroke-width="3.5"/>

  <!-- Bold Glowing Calabay 'C' Emblem -->
  <g filter="url(#glow)">
    <path d="M88 38 A36 36 0 1 0 88 90" 
          fill="none" 
          stroke="url(#calabay-grad)" 
          stroke-width="15" 
          stroke-linecap="round"/>
    
    <!-- Central Active Verification / Security Dot -->
    <circle cx="64" cy="64" r="8.5" fill="#10b981" />
  </g>
</svg>
